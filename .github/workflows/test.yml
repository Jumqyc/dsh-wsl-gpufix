name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
      - name: Patch templates sanity
        run: |
          grep -q 'name: dsh-wsl-gpufix' cordis.patch.yml
          grep -q 'gpu-device-grant' cordis.patch.yml
          grep -q '__MODULE_URL__' home/cordis.patch.yml
          grep -q 'gpu-device-grant' home/cordis.patch.yml
